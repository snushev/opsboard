services:
  db:
    image: postgres:15-alpine
    container_name: opsboard-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: .
    container_name: opsboard
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn src.opsboard.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  pg_data:
